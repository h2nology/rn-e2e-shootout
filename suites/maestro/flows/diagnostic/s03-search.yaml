# S3 防抖搜索（inputText 的 ASCII 文字逐个按键输入）
appId: com.rnshootout.app
name: S3
onFlowStart:
  - runFlow: ../common/reset.yaml
---
- runFlow: ../common/login.yaml
- tapOn:
    id: search-input
- inputText: Item 04
# 软键盘会盖住列表下半部分（#item-row-49），先收起
- hideKeyboard
- assertVisible:
    id: search-count
    text: 10 results
- assertVisible:
    id: item-row-40
- assertVisible:
    id: item-row-49
- assertNotVisible:
    id: item-row-1
