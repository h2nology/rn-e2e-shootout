# S3 防抖搜索（inputText 的 ASCII 文字逐个按键输入）
appId: com.rnshootout.app
name: S3
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: search-input
- inputText: Item 04
# 软键盘会盖住列表下半部分（#item-row-49），先收起
# iOS：Maestro 的 hideKeyboard 在屏幕中央小幅滑动来收起键盘，本 app 的列表 / 表单滑动不收起键盘（RN 默认
# keyboardDismissMode none）→ 软键盘显示时必定失败（M4 harness 冒烟；M3 时通过的原因见 RESULTS.md）。改按回车
# （单行 TextInput 提交时失去焦点）。Android：hideKeyboard（返回键）
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- assertVisible:
    id: search-count
    text: 10 results
- assertVisible:
    id: item-row-40
- assertVisible:
    id: item-row-49
- assertNotVisible:
    id: item-row-1
