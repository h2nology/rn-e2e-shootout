# S12 左滑删除（swipe from 行元素向左）
appId: com.rnshootout.app
name: S12
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- swipe:
    from:
      id: item-row-1
    direction: LEFT
- tapOn:
    id: swipe-delete-1
- assertNotVisible:
    id: item-row-1
- assertVisible:
    id: list-top-title
    text: "Top: Item 002"
