# S13 下拉刷新（swipe from 列表向下）
appId: com.rnshootout.app
name: S13
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- runScript:
    file: ../common/http.js
    env:
      PATH: /test/items
      BODY: '{"title":"Server item"}'
- swipe:
    from:
      id: item-list
    direction: DOWN
- assertVisible:
    id: list-top-title
    text: "Top: Server item"
