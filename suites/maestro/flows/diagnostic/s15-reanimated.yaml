# S15 Reanimated 动画
appId: com.rnshootout.app
name: S15
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-explore
- tapOn:
    id: open-reanimated
- tapOn:
    id: rea-card
- tapOn:
    id: rea-card-action
- assertVisible:
    id: rea-result
    text: Action done
