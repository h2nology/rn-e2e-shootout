# S20 键盘遮挡（收起键盘：Maestro hideKeyboard）
appId: com.rnshootout.app
name: S20
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-settings
- tapOn:
    id: open-long-form
- tapOn:
    id: form-notes
- inputText: note
- hideKeyboard
- tapOn:
    id: form-submit
- assertVisible:
    id: form-result
    text: "Submitted: note"
