# S2 错误邮箱的校验提示
appId: com.rnshootout.app
name: S2
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- tapOn:
    id: login-email
- inputText: not-an-email
- tapOn:
    id: login-password
- inputText: Passw0rd!
- tapOn:
    id: login-submit
- assertVisible:
    id: login-email-error
    text: Invalid email
- assertNotVisible:
    id: item-list
