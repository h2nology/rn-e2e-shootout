# S5 删除条目，确认 Modal
appId: com.rnshootout.app
name: S5
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: item-delete-2
- assertVisible:
    id: confirm-modal
- tapOn:
    id: confirm-ok
- assertNotVisible:
    id: confirm-modal
- assertNotVisible:
    id: item-row-2
- assertVisible:
    id: item-row-1
- assertVisible:
    id: item-row-3
