# S6 长列表滚动到第 400 行（scrollUntilVisible）
appId: com.rnshootout.app
name: S6
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
# [W3] 默认 timeout 20 s 只能滚到约第 50 行，放宽到 300 s（METHODOLOGY 6.5：改超时计入 W3）。
#      speed 保持默认 40：speed 100 会产生惯性滚动，在两次检查之间越过第 400 行（实测滚到了列表末尾）
- scrollUntilVisible:
    element:
      id: item-row-400
    direction: DOWN
    timeout: 300000
- tapOn:
    id: item-row-400
- assertVisible:
    id: item-detail-title
    text: Item 400
