# S10a 预先授权（Maestro setPermissions）
appId: com.rnshootout.app
name: S10a
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
# iOS 的定位权限取值为 always / inuse / never（allow 报错 “wrong argument value”）
- runFlow:
    when:
      platform: iOS
    commands:
      - setPermissions:
          permissions:
            location: inuse
- runFlow:
    when:
      platform: Android
    commands:
      - setPermissions:
          permissions:
            location: allow
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-settings
- tapOn:
    id: open-permission
- tapOn:
    id: request-location
- assertVisible:
    id: permission-status
    text: Granted
