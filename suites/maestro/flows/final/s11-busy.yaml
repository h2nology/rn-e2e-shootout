# S11 永不静止的动画
appId: com.rnshootout.app
name: S11
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-explore
- tapOn:
    id: open-busy-animation
- tapOn:
    id: busy-tap
- assertVisible:
    id: busy-result
    text: Tapped 1
