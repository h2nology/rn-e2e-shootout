# S16 轮询与 WebSocket
appId: com.rnshootout.app
name: S16
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-explore
- tapOn:
    id: open-live
- tapOn:
    id: live-name
- inputText: Alice
- tapOn:
    id: live-submit
- assertVisible:
    id: live-greeting
    text: Hello, Alice
