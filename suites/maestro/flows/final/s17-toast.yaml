# S17 自动消失的 Toast
appId: com.rnshootout.app
name: S17
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-save
- assertVisible:
    id: toast
    text: Saved
- assertNotVisible:
    id: toast
