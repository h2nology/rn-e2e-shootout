# S19 Tab 与嵌套导航
appId: com.rnshootout.app
name: S19
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-explore
- tapOn:
    id: explore-counter
    repeat: 3
- tapOn:
    id: open-explore-detail
- assertVisible:
    id: explore-detail-title
    text: Explore detail
- runFlow: ../common/back.yaml
- assertVisible:
    id: explore-counter-value
    text: "3"
- tapOn:
    id: tab-home
- tapOn:
    id: tab-explore
- assertVisible:
    id: explore-counter-value
    text: "3"
