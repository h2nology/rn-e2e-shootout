# S22 本地通知：从系统通知中心点击（打开通知中心：从屏幕顶端向下滑）
appId: com.rnshootout.app
name: S22
onFlowStart:
  - runFlow: ../common/reset.yaml
# harness 计时标记：场景结束（失败时也执行）
onFlowComplete:
  - runScript:
      file: ../common/mark.js
      env:
        EVENT: scenario-end
---
# 前置“通知权限已预先授权”：Android 有效。iOS 无效（Maestro 2.11.0 iOS 的 setPermissions 不支持 notifications，
# 静默忽略），harness 每次重装 app 后点 “Notify in 3 s” 会弹出权限请求 → 在场景内点 “Allow”（限制，RESULTS.md）
- setPermissions:
    permissions:
      notifications: allow
- runFlow: ../common/login.yaml
- tapOn:
    id: tab-settings
- tapOn:
    id: notify-in-3s
- runFlow:
    when:
      platform: iOS
      visible: Allow
    commands:
      # 同一 flow 内 tapOn: Allow 找不到元素（元素树中有 accessibilityText=Allow，单独会话可点中）→ 按坐标点（iPhone 17）
      - tapOn:
          point: 68%,59%
- pressKey: home
- swipe:
    start: 20%, 0%
    end: 20%, 60%
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Hello from rnshootout
- runFlow:
    when:
      platform: iOS
    commands:
      # iOS 通知中心把同一 app 的多条通知折叠为一组（已送达的通知不随 app 数据清除，第二轮起必然折叠），
      # 先点一下展开。展开后出现 “Show less”（label 实为 “Confirm Show less”；Maestro 的文字匹配是整串正则）
      - tapOn: Hello from rnshootout
      - runFlow:
          when:
            visible: Hello from rnshootout
          commands:
            # 点击后通知仍在（未打开 app）：iOS 27 通知中心里对通知卡片的点击被识别成横向滑动（Appium 接入时同样实测）；
            # 折叠时第一下只是展开。harness 每次重装 app 后只有一条通知、不折叠，同样走这里。
            # 改为用户的另一种打开方式：右滑最上面（最新）的卡片，点露出的 “Open”
            - swipe:
                from:
                  text: Hello from rnshootout
                  index: 0
                direction: RIGHT
            - tapOn: Open
- assertVisible:
    id: notification-target
    text: Opened from notification
